<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112255" />
      <stop offset="50%" stop-color="#0D1C42" />
      <stop offset="100%" stop-color="#070E24" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D1C42" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Blue to Cyan Gradient -->
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Accent Cyan Glow Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Subtle Drop Shadow / Glow for crisp vector mark -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="32" y="32" width="960" height="960" rx="224" ry="224" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.4" />

  <!-- Radial Glow Behind Emblem -->
  <circle cx="512" cy="512" r="380" fill="url(#radialGlow)" />

  <!-- Center Emblem Group -->
  <g id="vault-folder-emblem" filter="url(#softGlow)">
    <!-- Outer Hexagonal Vault Dial Ring -->
    <!-- Hexagon vertices computed at R=260 centered at (512, 512) -->
    <polygon points="512,252 737,382 737,642 512,772 287,642 287,382"
             fill="none"
             stroke="url(#electricGlow)"
             stroke-width="14"
             stroke-linejoin="round" />

    <!-- Hexagon Inner Concentric Track -->
    <polygon points="512,284 710,398 710,626 512,740 314,626 314,398"
             fill="none"
             stroke="#3B82F6"
             stroke-opacity="0.3"
             stroke-width="4"
             stroke-dasharray="16 12"
             stroke-linejoin="round" />

    <!-- Vault Dial Notches at Hexagon Vertices & Midpoints -->
    <circle cx="512" cy="252" r="7" fill="#60A5FA" />
    <circle cx="737" cy="382" r="7" fill="#60A5FA" />
    <circle cx="737" cy="642" r="7" fill="#60A5FA" />
    <circle cx="512" cy="772" r="7" fill="#60A5FA" />
    <circle cx="287" cy="642" r="7" fill="#60A5FA" />
    <circle cx="287" cy="382" r="7" fill="#60A5FA" />

    <!-- Secondary Vault Gear Teeth / Dial Ray markers -->
    <line x1="512" y1="218" x2="512" y2="238" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />
    <line x1="766" y1="365" x2="749" y2="375" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />
    <line x1="766" y1="659" x2="749" y2="649" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />
    <line x1="512" y1="806" x2="512" y2="786" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="659" x2="275" y2="649" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />
    <line x1="258" y1="365" x2="275" y2="375" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" />

    <!-- Minimalist Folder Silhouette in the Center -->
    <!-- Folder Back Tab & Body combined with Vault Geometric Cut -->
    <path d="M 374,420 
             L 446,420 
             L 480,456 
             L 650,456 
             C 662,456 670,465 670,476 
             L 670,612 
             C 670,624 662,634 650,634 
             L 374,634 
             C 362,634 354,624 354,612 
             L 354,442 
             C 354,430 362,420 374,420 Z"
          fill="#11245A"
          fill-opacity="0.65"
          stroke="url(#cyanAccent)"
          stroke-width="12"
          stroke-linejoin="round" />

    <!-- Folder Front Flap Crease / Horizon Line -->
    <path d="M 354,496 L 670,496"
          stroke="#60A5FA"
          stroke-width="6"
          stroke-opacity="0.5" />

    <!-- Central Vault Dial Wheel / Node Hub embedded into folder -->
    <!-- Outer dial circle -->
    <circle cx="512" cy="552" r="54"
            fill="#0A1636"
            stroke="url(#electricGlow)"
            stroke-width="9" />

    <!-- Vault Wheel Cross Pins / Dial Spoke (Tri-spoke or 4-spoke vault handle) -->
    <circle cx="512" cy="552" r="18" fill="#60A5FA" />
    <line x1="512" y1="510" x2="512" y2="534" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" />
    <line x1="512" y1="570" x2="512" y2="594" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" />
    <line x1="470" y1="552" x2="494" y2="552" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" />
    <line x1="530" y1="552" x2="554" y2="552" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" />

    <!-- Keyhole / Data Node Slot in Center -->
    <circle cx="512" cy="552" r="5" fill="#0D1C42" />
  </g>
</svg>
