<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010736" />
    <meta name="description" content="Homelab file manager for your local network" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NodeVault" />
    <link rel="manifest" href="manifest.json" />
    <title>NodeVault — Homelab File Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  </head>
  <body>
    <script>
      try {
        var f = localStorage.getItem('nodevault-theme-family');
        var m = localStorage.getItem('nodevault-theme-mode');
        document.documentElement.dataset.theme =
          f === 'navy' || f === 'emerald' || f === 'amber' || f === 'violet' ? f : 'navy';
        document.documentElement.dataset.mode = m === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'navy';
        document.documentElement.dataset.mode = 'dark';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
