name: homelabs-upload
services:
  backend:
    # Context is the repo root so the image bakes BOTH backend and frontend.
    # APP_BASE_PATH serves the UI under a subpath (e.g. /nodevault) so one
    # domain can front several projects; "" restores domain-root serving.
    build:
      context: ..
      dockerfile: ./server/Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/nodevault/}
    # Host port 8081: the server already runs a root-owned node service on 8080.
    # Container still listens on 8080 internally (Dockerfile healthcheck unchanged).
    ports:
      - "${SERVER_PORT:-8081}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_ROOT: /data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10737418240}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3456}
      API_KEY: ${API_KEY:-}
      APP_BASE_PATH: ${APP_BASE_PATH:-/nodevault/}
      # Postgres is the only database (mandatory). Defaults to the postgres
      # service below; override with a managed instance if you have one.
      DATABASE_URL: ${DATABASE_URL:-postgres://nodevault:nodevault@postgres:5432/nodevault?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Named volume by default (NOT a ./data bind mount): uploads under
      # /data/files and access.log must survive `docker compose down` AND the
      # deploy job's fresh checkout (actions/checkout wipes gitignored paths
      # like ./data). (Users/sessions/logs now live in Postgres, not here.)
      #
      # Custom host location: set DATA_DIR=/srv/nodevault/data (or any path
      # OUTSIDE the checkout) in server/.env — it becomes a bind mount.
      # The backend runs as root, so no permission setup is needed.
      - ${DATA_DIR:-nodevault-data}:/data
    networks:
      - gateway-net
    restart: unless-stopped

  # Postgres — the application's only database.
  # Data lives in the pgdata named volume (survives down/rebuilds/redeploys).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodevault}
      POSTGRES_DB: ${POSTGRES_DB:-nodevault}
    volumes:
      # pgdata named volume by default; PGDATA_DIR=/srv/nodevault/pgdata (or
      # any path outside the checkout) makes it a host bind mount instead.
      # The postgres image runs as uid 999, so pre-create with:
      #   mkdir -p /srv/nodevault/pgdata && chown -R 999:999 /srv/nodevault/pgdata
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      # Lets the backend wait for a READY database instead of crash-looping
      # on first boot while Postgres initializes the data directory.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nodevault} -d $${POSTGRES_DB:-nodevault}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - gateway-net
    restart: unless-stopped

  # Gateway: routes one domain to many projects by path prefix.
  # Public entrypoint (:80) — backends stay reachable directly for debugging.
  # No server-side setup: the Caddyfile ships in ./gateway, the image is
  # pulled automatically, compose starts it with the backend.
  gateway:
    image: caddy:2-alpine
    # Host 8888: :80 is owned by the server's Apache — do not touch it.
    ports:
      - "8888:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:

volumes:
  caddy_data:
  nodevault-data:
  pgdata:
