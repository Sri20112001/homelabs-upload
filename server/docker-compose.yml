services:
  backend:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_ROOT: /data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10737418240}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3456}
      API_KEY: ${API_KEY:-}
    volumes:
      - ./data:/data/files
    restart: unless-stopped
