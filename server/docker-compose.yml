services:
  backend:
    # Context is the repo root so the image bakes BOTH backend and frontend.
    build:
      context: ..
      dockerfile: ./server/Dockerfile
    # Host port 8081: the server already runs a root-owned node service on 8080.
    # Container still listens on 8080 internally (Dockerfile healthcheck unchanged).
    ports:
      - "${SERVER_PORT:-8081}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_ROOT: /data/files
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10737418240}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3456}
      API_KEY: ${API_KEY:-}
    volumes:
      # Mount the parent so BOTH /data/files (uploads) and
      # /data/.nodevault/nodevault.db (users, sessions, activity) persist.
      - ./data:/data
    networks:
      - gateway-net
    restart: unless-stopped

  # Gateway: routes one domain to many projects by path prefix.
  # Public entrypoint (:80) — backends stay reachable directly for debugging.
  # No server-side setup: the Caddyfile ships in ./gateway, the image is
  # pulled automatically, compose starts it with the backend.
  gateway:
    image: caddy:2-alpine
    # Host 8888: :80 is owned by the server's Apache — do not touch it.
    ports:
      - "8888:80"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:

volumes:
  caddy_data:
