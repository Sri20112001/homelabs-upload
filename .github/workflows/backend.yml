# Secrets (repo Settings → Secrets and variables → Actions → Secrets tab):
#   SERVER_HOST    server IP, bare — from `hostname -I` on the server
#   SERVER_USER    SSH login — must equal `whoami` on the server
#   SERVER_SSH_KEY private key whose .pub line is in ~/.ssh/authorized_keys
#                  (verify with: grep -c "<unique-mid-key-fragment>" ~/.ssh/authorized_keys)
#   SERVER_PATH    repo dir on server, e.g. /home/<user>/homelabs-upload
# First-time server setup is scripted: DEPLOY_PUBKEY='...' bash server/provision.sh
name: backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      # setup-go caches modules only — persist the *build* cache too,
      # otherwise every run recompiles the world from scratch.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-
      - run: go vet ./...
      - run: go test ./...

  deploy:
    name: deploy to server
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deploy secrets
        run: |
          fail=0
          [ -z "${{ secrets.SERVER_HOST }}" ] && { echo "::error::Missing repository secret SERVER_HOST (server IP/hostname)"; fail=1; }
          [ -z "${{ secrets.SERVER_USER }}" ] && { echo "::error::Missing repository secret SERVER_USER (SSH username)"; fail=1; }
          [ -z "${{ secrets.SERVER_SSH_KEY }}" ] && { echo "::error::Missing repository secret SERVER_SSH_KEY (private key)"; fail=1; }
          [ -z "${{ secrets.SERVER_PATH }}" ] && { echo "::error::Missing repository secret SERVER_PATH (repo dir on server)"; fail=1; }
          if [ $fail -ne 0 ]; then
            echo "::error::Add them under repo Settings → Secrets and variables → Actions → Secrets tab (NOT Variables tab), then re-run."
            exit 1
          fi
          echo "All deploy secrets present."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: ${{ secrets.SERVER_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GH_TOKEN,REPO_DIR
          script: |
            set -e
            # First run ever: clone the repo (later runs just fast-forward it).
            # If something non-git already sits at the path, move it aside first.
            if [ ! -d "$REPO_DIR/.git" ]; then
              mkdir -p "$(dirname "$REPO_DIR")"
              if [ -e "$REPO_DIR" ]; then
                mv "$REPO_DIR" "${REPO_DIR}.bak-$(date +%s)"
              fi
              git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            cd server
            docker compose build --pull
            # Stop our own stale containers first (same project recreates cleanly).
            docker compose down --remove-orphans >/dev/null 2>&1 || true
            # If the port is STILL held, it belongs to something else — report it instead of failing cryptically.
            if docker ps --format '{{.Ports}}' 2>/dev/null | grep -q '0.0.0.0:8080'; then
              echo "::error::host port 8080 is held by another container (not this project):"
              docker ps --filter "publish=8080" --format 'table {{.Names}}\t{{.Ports}}\t{{.Image}}'
              echo "Stop it (docker stop <name>) or change the host port, then re-run."
              exit 1
            fi
            docker compose up -d
            docker image prune -f
            sleep 8
            curl -f http://localhost:8080/health
